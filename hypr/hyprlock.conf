# General Settings
general {
    ignore_empty_input = true
    hide_cursor = true
}

# Background (uses live blurred desktop screenshot — no external photo needed)
background {
    monitor =
    path = screenshot
    color = rgba(19, 20, 13, 1.0)
    blur_passes = 3
    blur_size = 6
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0000
}

# Password Input Field
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Sans
    placeholder_text = <span foreground="##ffffff99">Enter Pass</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(216, 222, 233, 0.80)
    font_size = 130
    font_family = Sans
    position = 0, 260
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 28
    font_family = Sans
    position = 0, 150
    halign = center
    valign = center
}

# Lock Icon
label {
    monitor =
    text = <span> </span>
    color = rgba(216, 222, 233, 0.70)
    font_size = 24
    font_family = Sans
    position = 2, -90
    halign = center
    valign = top
}

